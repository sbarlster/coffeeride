  <body>
    <h1>Voi Coffee Edinburgh</h1>
    <p>Find a bike. Ride, coffee, ride, coffee, ride again, coffee, ride ride ride, coffee, go home. Wired!</p>

    <div id="map"></div>

    <script>
      var map = L.map('map').setView([55.948, -3.2], 15);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 21,
          attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      var circle = L.circle([55.948, -3.2], {
          color: '#4b371c',
          fillColor: '#4b371c',
          fillOpacity: 0.2,
          radius: 1000
      }).addTo(map);

      var loadCoffeeShops = function() {

        fetch("./shop-data.json").then((response) => {
            return response.json()
        }).then(data => {
            console.log(data);
            data.forEach(function(shop) {
              var coffeeMarker = L.marker([shop.lat, shop.lon]).addTo(map);
              coffeeMarker.bindPopup("<b>" + shop.name + "</b><br> " + shop.description);
            });
        });
